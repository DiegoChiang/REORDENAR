<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orden aleatorio de estudiantes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="header">
        <h1>Orden aleatorio de estudiantes</h1>
        <p class="subtitle">
          Genera un nuevo orden para los 40 alumnos y visualízalo como lista o
          distribución del salón.
        </p>
      </div>

      <div class="controls">
        <button id="shuffleBtn" type="button">Reordenar aleatoriamente</button>
        <button id="resetBtn" type="button">Restablecer orden original</button>
        <span class="status" id="status" aria-live="polite">Orden original</span>
      </div>

      <div class="view-switcher" role="tablist" aria-label="Seleccionar vista">
        <button
          class="view-tab is-active"
          id="listTab"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="listView"
          data-view="listView"
        >
          Vista de lista
        </button>
        <button
          class="view-tab"
          id="classroomTab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="classroomView"
          data-view="classroomView"
          tabindex="-1"
        >
          Vista del salón
        </button>
      </div>

      <section
        class="view-panel"
        id="listView"
        role="tabpanel"
        aria-labelledby="listTab"
      >
        <ol class="student-list" id="studentList"></ol>
      </section>

      <section
        class="view-panel classroom-view"
        id="classroomView"
        role="tabpanel"
        aria-labelledby="classroomTab"
        hidden
      >
        <div class="classroom-front" aria-hidden="true">
          <span>Pizarra</span>
          <small>Frente del salón</small>
        </div>
        <div class="classroom-scroll">
          <div
            class="classroom-layout"
            id="classroomLayout"
            aria-label="Distribución de los 40 alumnos en el salón"
          ></div>
        </div>
        <p class="aisle-label" aria-hidden="true">Pasillo central</p>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
